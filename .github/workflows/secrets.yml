# Nothing may be written into data/ or media/img|gif.
#
# Separate from tests.yml on purpose. This needs `fetch-depth: 0` to diff, runs on every
# push rather than only main, and must not be able to go green because the Node matrix
# was skipped or a dependency install fell over. A secret landing in a diff is a
# different class of event from a failing test and deserves its own red X.
#
# The reasoning for why an ignore file is not enough lives in the script, next to the
# code, so the two cannot drift: .gitignore governs which UNTRACKED files git discovers,
# and has no opinion about content arriving from a ref. `git add -f`, a cherry-pick, and
# `git checkout upstream/main -- data/` all walk straight past it - and that last one is
# the move CLAUDE.md singles out, because upstream's history carries the session secret,
# the VAPID private key and real passkey credentials as literal values.
#
# Like site-privacy checks elsewhere, the push trigger is a fire alarm rather than a
# gate: a red X on a pushed commit means the content is already in history and has to be
# rotated, not deleted. The PR trigger is the one that can actually stop it.

name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  # Never cancel a push run. If push A wrote into data/ and push B follows, B's run
  # diffs A..B and would not re-flag A - A's own run has to survive to fail.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: "secrets: nothing written into data/ or media/"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a diff needs history, not just the tip

      - name: No content added under data/ or media/img|gif
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          # The script handles the all-zero SHA (branch creation) and an unknown SHA
          # (force push) itself, and reports COULD NOT VERIFY rather than passing when it
          # genuinely cannot resolve a base.
          scripts/check-protected-paths.sh "$BASE" "$GITHUB_SHA"

      - name: What this run did NOT check
        if: always()
        shell: bash
        run: |
          {
            echo "### secrets: a PATH rule, not a content scan"
            echo
            echo "A green run means no file was added or modified under \`data/\`,"
            echo "\`media/img/\` or \`media/gif/\`, and that \`.gitignore\` still carries its four"
            echo "protective carve-outs. It does **not** mean this change contains no secret."
            echo
            echo "- **Content is not scanned.** A key pasted into \`api/server.js\`, into an"
            echo "  \`.env.example\`, or into a commit message is not caught here, and nothing"
            echo "  in this repo catches it today."
            echo "- **History is not scanned.** This guards the diff. Upstream's history"
            echo "  already contains the session secret, the VAPID private key and real"
            echo "  passkey credentials, and that is unchanged by any run of this job."
            echo "- **A secret that never becomes a diff is invisible to it** — a value typed"
            echo "  into a running container, or left in an untracked file."
            echo
            echo "If a real secret has been committed, flag it rather than deleting the file:"
            echo "from that commit on it is in the history and has to be **rotated**."
          } >> "$GITHUB_STEP_SUMMARY"
